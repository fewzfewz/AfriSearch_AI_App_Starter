<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AfriSearch answers questions about your documents in English, Amharic, Swahili and 90+ other languages, with citations to the exact passages." />
    <meta name="theme-color" content="#c2410c" />
    <title>AfriSearch — answers from your documents, in your language</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before the page paints, so dark mode doesn't flash.
      try {
        const saved = localStorage.getItem("afrisearch.theme") || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white text-ink-900 antialiased dark:bg-ink-950 dark:text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
