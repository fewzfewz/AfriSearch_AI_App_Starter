# Streamlit theme for the AfriSearch UI. Defining both a light and a dark theme
# keeps Streamlit following the system (or the user's) light/dark setting.
[theme]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#C2410C"  # terracotta; keeps white button text readable
linkColor = "#C2410C"

[theme.dark]
base = "dark"
primaryColor = "#C2410C"
linkColor = "#FB923C"  # lighter, so links stay readable on a dark background

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 15  # MB; matches MAX_UPLOAD_BYTES in backend/main.py
