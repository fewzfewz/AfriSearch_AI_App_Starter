# docker compose up --build    then open http://127.0.0.1:8000
#
# Settings come from your shell or a .env file next to this file (see .env.example).
# Without sign-in (AFRISEARCH_AUTH=none) the app listens on 127.0.0.1 only: anyone
# who can reach it can use every document. Turn on sign-in before exposing it.
services:
  afrisearch:
    build: .
    image: afrisearch:0.2.0
    environment:
      AFRISEARCH_AUTH: ${AFRISEARCH_AUTH:-none}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      AFRISEARCH_AUTH_PROVIDERS: ${AFRISEARCH_AUTH_PROVIDERS:-}
      AFRISEARCH_DEFAULT_PROVIDER: ${AFRISEARCH_DEFAULT_PROVIDER:-}
      AFRISEARCH_RERANKER: ${AFRISEARCH_RERANKER:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      AFRISEARCH_OCR_LANGS: ${AFRISEARCH_OCR_LANGS:-eng+amh+swa}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - afrisearch-data:/app/data   # accounts, workspaces, documents, indexes, chats
      - afrisearch-models:/models   # downloaded model weights (~1 GB on first use)
    ports:
      - "${AFRISEARCH_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

volumes:
  afrisearch-data:
  afrisearch-models:
