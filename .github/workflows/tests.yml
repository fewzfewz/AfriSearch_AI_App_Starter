name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      # Fake models and fake OCR: no downloads, keys or GPU needed.
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t afrisearch:ci .
      - name: Check Tesseract and the app import inside the image
        run: |
          docker run --rm afrisearch:ci tesseract --list-langs
          docker run --rm afrisearch:ci python -c "from backend import __version__, main; print('AfriSearch', __version__)"
